<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projetos · wallyboy22</title>
<meta name="description" content="Índice de todas as páginas GitHub Pages de wallyboy22.">
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --text: #1d2321; --muted: #5d6763;
    --line: #dfe3e0; --accent: #c2410c; --accent-soft: #fff1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --card: #1b201e; --text: #e8ece9; --muted: #9aa49f;
      --line: #2b322f; --accent: #fb923c; --accent-soft: #2a1b12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 72px; }
  h1 { font-size: 1.9rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 36px; }
  .sub a { color: inherit; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.card {
    display: block; padding: 18px 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .name { font-weight: 600; font-size: 1.08rem; display: flex; justify-content: space-between; gap: 12px; }
  .name span { color: var(--accent); }
  .desc { color: var(--muted); margin-top: 4px; font-size: .95rem; }
  .url { margin-top: 10px; font: 13px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
  .tag {
    display: inline-block; margin-top: 10px; margin-left: 8px; padding: 1px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); font-size: 12px;
  }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Meus projetos publicados</h1>
  <p class="sub">Todas as páginas GitHub Pages de <a href="https://github.com/wallyboy22">wallyboy22</a>.</p>

  <ul id="list"></ul>

  <footer>
    Código-fonte de cada projeto: <a href="https://github.com/wallyboy22?tab=repositories">github.com/wallyboy22</a>
  </footer>
</main>

<script>
  // Para adicionar um novo site, inclua uma linha nesta lista.
  const sites = [
    {
      title: "CCAL · Calculadora de Carbono",
      desc: "Calculadora de carbono do IPAM.",
      url: "https://wallyboy22.github.io/carboncal_2-0/",
      repo: "https://github.com/wallyboy22/carboncal_2-0"
    },
    {
      title: "Monitor de Emissões por Fogo",
      desc: "Monitoramento de emissões por queimadas.",
      url: "https://wallyboy22.github.io/emiss_fire_monitor/",
      repo: "https://github.com/wallyboy22/emiss_fire_monitor"
    }
  ];

  const list = document.getElementById("list");
  for (const s of sites) {
    const li = document.createElement("li");
    li.innerHTML = `
      <a class="card" href="${s.url}">
        <div class="name">${s.title}<span aria-hidden="true">→</span></div>
        <div class="desc">${s.desc}</div>
        <div class="url">${s.url.replace("https://", "")}</div>
      </a>`;
    list.appendChild(li);
  }
</script>
</body>
</html>
