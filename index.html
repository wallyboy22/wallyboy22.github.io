<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Páginas publicadas</title>
<meta name="description" content="Índice de páginas e aplicações publicadas.">
<style>
  :root {
    --bg: #fafaf9; --text: #1c1c1a; --muted: #6b6b66; --line: #e4e4e0;
    --card: #ffffff; --chip: #f0f0ed; --chip-on: #1c1c1a; --chip-on-text: #fafaf9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --text: #ececea; --muted: #8e8e88; --line: #2a2a28;
      --card: #1b1b19; --chip: #222220; --chip-on: #ececea; --chip-on-text: #141413;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 20px; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filters button {
    font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 99px;
    border: 0; background: var(--chip); color: var(--text); cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 8px; }

  ul {
    list-style: none; padding: 0; margin: 0;
    display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  li a {
    display: flex; flex-direction: column; height: 100%;
    color: inherit; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  li a:hover { border-color: var(--muted); box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  li a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .img { aspect-ratio: 16 / 10; background: var(--chip); border-bottom: 1px solid var(--line); overflow: hidden; }
  .img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .3s; }
  li a:hover .img img { transform: scale(1.03); }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .t { font-weight: 600; }
  .d { color: var(--muted); font-size: 14px; }
  .u { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
  .tags span { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Páginas publicadas</h1>
  <div class="filters" id="filters" role="group" aria-label="Filtrar por tag"></div>
  <p class="count" id="count"></p>
  <ul id="list"></ul>
</main>

<script>
  // Para adicionar algo novo: inclua um item nesta lista. As tags viram filtros automaticamente.
  const items = [
    {
      title: "Calculadora de Carbono (CCAL)",
      desc: "Estoques, emissões e remoções de carbono da vegetação nativa no Brasil.",
      url: "https://wallyboy22.github.io/carboncal_2-0/",
      thumb: "thumbs/carboncal.webp",
      tags: ["carboncal", "ipam"]
    },
    {
      title: "Monitor de emissões por fogo",
      desc: "Emissões mensais de CO₂, CH₄ e N₂O por queima de vegetação, por bioma, UF e classe.",
      url: "https://wallyboy22.github.io/emiss_fire_monitor/",
      thumb: "thumbs/emissoes.webp",
      tags: ["ipam", "mapbiomas fogo"]
    },
    {
      title: "Painel MapBiomas Fogo",
      desc: "Coleção 5.1 · 8 países.",
      url: "https://mapbiomas.github.io/brazil-fire/dashboard/",
      thumb: "thumbs/painel.webp",
      tags: ["mapbiomas fogo"]
    },
    {
      title: "Boletim do Monitor do Fogo · Brasil",
      desc: "Boletim mensal.",
      url: "https://mapbiomas.github.io/brazil-fire/fire_monitor_highlights/brazil/",
      thumb: "thumbs/boletim-br.webp",
      tags: ["mapbiomas fogo"]
    },
    {
      title: "Boletín del Monitor de Fuego · Perú",
      desc: "Boletín mensual.",
      url: "https://mapbiomas.github.io/brazil-fire/fire_monitor_highlights/peru/",
      thumb: "thumbs/boletin-pe.webp",
      tags: ["mapbiomas fogo"]
    },
    {
      title: "Monitor global de fogo",
      desc: "Exploratório.",
      url: "https://mapbiomas.github.io/brazil-fire/global_analises/",
      thumb: "thumbs/global.webp",
      tags: ["mapbiomas fogo"]
    },
    {
      title: "Legendas e paletas",
      desc: "Legendas e paletas de cores do MapBiomas Fogo.",
      url: "https://mapbiomas.github.io/brazil-fire/legends/",
      thumb: "thumbs/legendas.webp",
      tags: ["mapbiomas fogo"]
    }
  ];

  const listEl = document.getElementById("list");
  const filtersEl = document.getElementById("filters");
  const countEl = document.getElementById("count");
  const allTags = [...new Set(items.flatMap(i => i.tags))].sort();
  let active = new URLSearchParams(location.search).get("tag") || "todas";
  if (active !== "todas" && !allTags.includes(active)) active = "todas";

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render() {
    filtersEl.innerHTML = ["todas", ...allTags].map(t =>
      `<button type="button" data-tag="${esc(t)}" aria-pressed="${t === active}">${esc(t)}</button>`
    ).join("");
    const shown = active === "todas" ? items : items.filter(i => i.tags.includes(active));
    countEl.textContent = `${shown.length} ${shown.length === 1 ? "página" : "páginas"}`;
    listEl.innerHTML = shown.map(i => `
      <li><a href="${esc(i.url)}">
        <div class="img">${i.thumb ? `<img src="${esc(i.thumb)}" alt="" loading="lazy" width="640" height="400">` : ""}</div>
        <div class="body">
          <span class="t">${esc(i.title)}</span>
          <span class="d">${esc(i.desc)}</span>
          <span class="u">${esc(i.url.replace(/^https:\/\//, ""))}</span>
          <span class="tags">${i.tags.map(t => `<span>${esc(t)}</span>`).join("")}</span>
        </div>
      </a></li>`).join("");
  }

  filtersEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    active = b.dataset.tag;
    const url = new URL(location);
    active === "todas" ? url.searchParams.delete("tag") : url.searchParams.set("tag", active);
    history.replaceState(null, "", url);
    render();
  });

  render();
</script>
</body>
</html>
